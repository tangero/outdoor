name: Automat recenzí

# Jeden workflow pro celý automat (ručně spustitelný i z jiné větve):
#   denně      – monitoring výrobců + třídění kandidátů + novinky → commit do master
#   út a pá    – napsání recenzí → commit článků i stavu fronty do master
#   ručně      – režim monitor / recenze / test (test nic necommituje, výstupy dá jako artefakt)

on:
  schedule:
    - cron: '0 9 * * *'     # monitoring + třídění
    - cron: '0 6 * * 2,5'   # recenze
  workflow_dispatch:
    inputs:
      rezim:
        description: 'Co spustit'
        required: true
        default: 'monitor'
        type: choice
        options: ['monitor', 'recenze', 'test']
      pocet:
        description: 'Počet recenzí (režim recenze/test)'
        required: false
        default: '2'
      id:
        description: 'ID kandidáta (volitelné, režim test)'
        required: false
        default: ''
      limit:
        description: 'Max. kandidátů ke třídění (režim monitor/test)'
        required: false
        default: '200'
      novinky:
        description: 'Počet novinek (režim monitor/test)'
        required: false
        default: '3'

concurrency:
  group: automat
  cancel-in-progress: false

jobs:
  automat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REZIM: ${{ github.event.inputs.rezim || (github.event.schedule == '0 6 * * 2,5' && 'recenze') || 'monitor' }}
      POCET: ${{ github.event.inputs.pocet || '2' }}
      LIMIT: ${{ github.event.inputs.limit || '200' }}
      NOVINKY: ${{ github.event.inputs.novinky || '3' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---------------------------- monitor ----------------------------
      - name: Monitoring výrobců
        if: env.REZIM == 'monitor' || env.REZIM == 'test'
        run: python scripts/monitor.py --verbose

      - name: Třídění kandidátů
        if: env.REZIM == 'monitor' || env.REZIM == 'test'
        run: python scripts/trideni.py --limit "$LIMIT" --verbose

      - name: Novinky výrobců
        if: env.REZIM == 'monitor'
        run: python scripts/novinky.py --pocet "$NOVINKY" --verbose

      - name: Commit stavu
        if: env.REZIM == 'monitor'
        run: |
          git add _automat/ _novinky/
          if git diff --cached --quiet; then
            echo "Beze změn."
          else
            git commit -m "Auto: monitoring výrobců ($(date -u '+%Y-%m-%d %H:%M'))"
            git pull --rebase
            git push
          fi

      # ---------------------------- recenze ----------------------------
      - name: Psaní recenzí
        if: env.REZIM == 'recenze'
        run: python scripts/recenze.py --pocet "$POCET" --verbose

      - name: Commit recenzí a stavu
        if: env.REZIM == 'recenze'
        run: |
          git add _posts _data/products.yml _automat/
          if git diff --cached --quiet; then
            echo "Žádná změna."
          else
            NOVE=$(git diff --cached --name-only -- _posts | wc -l | tr -d ' ')
            git commit -m "Auto: recenze ($NOVE nových, $(date -u '+%Y-%m-%d %H:%M'))"
            git pull --rebase
            git push
          fi

      # ----------------------------- test ------------------------------
      - name: Recenze nanečisto
        if: env.REZIM == 'test'
        run: python scripts/recenze.py --pocet "$POCET" ${KANDIDAT:+--id "$KANDIDAT"} --dry-run --verbose
        env:
          KANDIDAT: ${{ github.event.inputs.id }}

      - name: Novinky nanečisto
        if: env.REZIM == 'test'
        run: python scripts/novinky.py --pocet "$NOVINKY" --dry-run --verbose

      - name: Výstupy testu
        if: always() && env.REZIM == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: automat-test
          path: |
            _automat/
          if-no-files-found: warn
