# Sledovaní výrobci outdoorového vybavení (čte scripts/monitor.py).
#
# Strategie:
#   shopify  – veřejný katalog /products.json; „nové“ = published_at v posledních
#              `max_age_days` dnech (výchozí 45). Zdarma, má hmotnost i cenu.
#   tinyfish – TinyFish Fetch stáhne stránku s novinkami (`list_url`), nové jsou
#              produktové odkazy, které ještě nejsou ve stavu. Zdarma do 1000 URL/den.
#   exa      – Exa.ai vyhledávání na doménách výrobce, jen stránky publikované od
#              posledního běhu (startPublishedDate). Stojí kredity.
#   rss / sitemap / scrape – viz scripts/monitor.py.
#
# `category` je jen nápověda; rubriku určuje až třídění kandidátů.

# ============================ SHOPIFY ============================

- name: "Black Diamond"
  category: "batohy"
  strategy: "shopify"
  shop_url: "https://www.blackdiamondequipment.com"

- name: "Garmont"
  category: "boty"
  strategy: "shopify"
  shop_url: "https://www.garmont.com"

- name: "Keen"
  category: "boty"
  strategy: "shopify"
  shop_url: "https://www.keenfootwear.com"

- name: "Scarpa"
  category: "boty"
  strategy: "shopify"
  shop_url: "https://www.scarpa.com"

- name: "Sea to Summit"
  category: "karimatky"
  strategy: "shopify"
  shop_url: "https://seatosummit.com"   # varianta s www. neodpovídá

- name: "Therm-a-Rest"
  category: "karimatky"
  strategy: "shopify"
  shop_url: "https://www.thermarest.com"

